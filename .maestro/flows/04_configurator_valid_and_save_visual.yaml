appId: com.dedtsss.catawgtunnel.debug
name: CAT Configurator valid candidate and save
tags:
  - cat
  - functional
  - visual
---
- launchApp:
    clearState: true
- tapOn: "Settings"
- assertVisible: "Tunnel"
- scrollUntilVisible:
    element: "AWG Configurator"
    direction: DOWN
- tapOn: "AWG Configurator"
- assertVisible: "AWG Configurator v1"
- scrollUntilVisible:
    element: "WireGuard/AWG profile (paste/import)"
    direction: DOWN
- tapOn: "WireGuard/AWG profile (paste/import)"
- inputText: "[Interface]\nPrivateKey = client-private-key\nAddress = 10.7.0.2/32, fd00::2/128\nDNS = 1.1.1.1, example.internal\nListenPort = 51820\nMTU = 1280\nJc = 4\nJmin = 100\nJmax = 200\nS1 = 0\nS2 = 0\nS3 = 0\nS4 = 0\nH1 = 1\nH2 = 2\nH3 = 3\nH4 = 4\n\n[Peer]\nPublicKey = server-public-key\nPresharedKey = peer-secret\nAllowedIPs = 0.0.0.0/0, ::/0\nEndpoint = vpn.example.com:51820\nPersistentKeepalive = 25"
- pressKey: Back
- scrollUntilVisible:
    element: "Validate locally"
    direction: DOWN
- tapOn: "Validate locally"
- scrollUntilVisible:
    element: "Local validation: valid"
    direction: DOWN
- assertVisible: "Local validation: valid"
- takeScreenshot: cat-10-configurator-valid
- scrollUntilVisible:
    element: "Save candidate"
    direction: UP
- tapOn: "Save candidate"
- assertVisible: "candidate profile saved; no networking change was applied"
- takeScreenshot: cat-11-configurator-saved
