appId: com.dedtsss.catawgtunnel.debug
name: CAT navigation and screen inventory
tags:
  - cat
  - functional
  - visual
---
- launchApp:
    clearState: true
- tapOn:
    point: "63%, 95%"
- scrollUntilVisible:
    element: "Cat Server"
    direction: DOWN
- assertVisible: "Client diagnostics"
- assertVisible: "Cat Server"
- assertVisible: "AWG Configurator"
- takeScreenshot: cat-01-settings
- tapOn: "Cat Server"
- assertVisible: "Connect Cat Server"
- assertVisible: "Status: Not configured"
- takeScreenshot: cat-02-cat-server-start
- pressKey: Back
- assertVisible: "AWG Configurator"
- tapOn: "AWG Configurator"
- assertVisible: "AWG Configurator v1"
- assertVisible: "AWG3 unavailable"
- takeScreenshot: cat-03-configurator-start
- pressKey: Back
- tapOn: "Client diagnostics"
- assertVisible: "Diagnostics"
- assertVisible: "Cat Server not connected; using standalone diagnostics."
- takeScreenshot: cat-04-diagnostics-offline
- pressKey: Back
- assertVisible: "Cat Server"
- tapOn:
    point: "88%, 95%"
- assertVisible: "Cat AWG Tunnel"
- assertVisible: "git SHA:"
- takeScreenshot: cat-12-support-provenance
