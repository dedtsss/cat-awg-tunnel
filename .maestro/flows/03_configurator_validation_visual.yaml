appId: com.dedtsss.catawgtunnel.debug
name: CAT Configurator validation and keyboard layout
tags:
  - cat
  - functional
  - visual
  - negative
---
- launchApp:
    clearState: true
- tapOn: "Settings"
- assertVisible: "Tunnel"
- scrollUntilVisible:
    element: "AWG Configurator"
    direction: DOWN
- tapOn: "AWG Configurator"
- assertVisible: "AWG Configurator v1"
- tapOn: "Candidate name"
- inputText: "Pilot invalid profile"
- pressKey: Back
- scrollUntilVisible:
    element: "WireGuard/AWG profile (paste/import)"
    direction: DOWN
- tapOn: "WireGuard/AWG profile (paste/import)"
- inputText: "[Interface]\nAddress = not-a-cidr"
- takeScreenshot: cat-08-configurator-keyboard
- pressKey: Back
- scrollUntilVisible:
    element: "Validate locally"
    direction: DOWN
- tapOn: "Validate locally"
- assertVisible: "Local validation: needs changes"
- takeScreenshot: cat-09-configurator-invalid
- scrollUntilVisible:
    element: "WireGuard/AWG profile (paste/import)"
    direction: UP
- tapOn: "WireGuard/AWG profile (paste/import)"
- eraseText: 1000
- inputText: "[Interface]\nPrivateKey = client-private-key\nAddress = 10.7.0.2/32\nDNS = 1.1.1.1\n\n[Peer]\nPublicKey = server-public-key\nAllowedIPs = 0.0.0.0/0\nEndpoint = vpn.example.com:51820\nPersistentKeepalive = 25"
- pressKey: Back
- scrollUntilVisible:
    element: "Validate locally"
    direction: DOWN
- tapOn: "Validate locally"
- scrollUntilVisible:
    element: "Local validation: valid"
    direction: DOWN
- assertVisible: "Local validation: valid"
- takeScreenshot: cat-10-configurator-valid
- scrollUntilVisible:
    element: "Save candidate"
    direction: UP
- tapOn: "Save candidate"
- assertVisible: "candidate profile saved; no networking change was applied"
- takeScreenshot: cat-11-configurator-saved
